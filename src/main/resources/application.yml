spring:
  datasource:
    url: jdbc:h2:mem:testdb
  h2: #브라우저로 DB를 볼 수 있게
    console:
      enabled: true
      path: /h2-console
  jpa:
    # 전송 쿼리 확인
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        ddl-auto: create

    # 테이블 생성 후에 data.sql 실행
    defer-datasource-initialization: true